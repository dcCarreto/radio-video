name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate source and target branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "dev" ]; then
              echo "::error::Pull requests into main must come from dev (got '$HEAD_REF')."
              exit 1
            fi
            exit 0
          fi
          pattern='^((feature|fix|refactor|test|docs|chore|perf)/[a-z0-9]+(-[a-z0-9]+)*|dependabot/.+)$'
          if ! [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' does not follow the naming convention (type/kebab-case-name)."
            exit 1
          fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify FFmpeg
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - name: Run tests
        env:
          RADIO_VIDEO_REQUIRE_FFMPEG: "1"
        run: pytest

  installer:
    name: Windows installer
    # Releases build their own installer with the release version.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Install dependencies
        run: python -m pip install -e ".[installer]"
      - name: Build installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import radio_video; print(radio_video.__version__)"
          python scripts/build_installer.py --version $version
      - name: Smoke test the frozen application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = "build/installer/dist/radio-video"
          & "$app/ffmpeg/ffmpeg.exe" -hide_banner -version
          Start-Process -Wait -FilePath "$app/radio-video.exe" `
            -ArgumentList "--ui-gallery", "--capture", "smoke", "--states", "start,loaded"
          if (-not (Test-Path "smoke\loaded-light-l.png")) { throw "The frozen app did not start" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/Radio-Video-Setup-*.exe
          retention-days: 7

  dependencies:
    name: Dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install . pip-audit
      - name: Check installed dependencies are consistent
        run: python -m pip check
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --skip-editable

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel installs
        run: |
          python -m pip install dist/*.whl
          python -c "import radio_video; print(radio_video.__version__)"
